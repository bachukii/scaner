<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>სკანერი</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f1115'/><g fill='%23fff'><rect x='22' y='30' width='6' height='40'/><rect x='34' y='30' width='3' height='40'/><rect x='43' y='30' width='7' height='40'/><rect x='56' y='30' width='3' height='40'/><rect x='65' y='30' width='6' height='40'/></g></svg>">
<style>
  :root {
    --ink: #0f1115; --panel: #171a21; --line: #2a2f3a;
    --dim: #8b93a5; --live: #38d17a; --idle: #6b7280;
    --wait: #f0a83c; --hit: #ffd24a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink); color: #eef1f6;
    font: 400 16px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }

  header { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); flex: none; }
  .dot.on { background: var(--live); }
  .dot.wait { background: var(--wait); }
  header span { color: var(--dim); font-size: 14px; }
  header b { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--dim); font-weight: 500; }

  .stage { position: relative; margin: 0 12px; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame { position: absolute; inset: 18% 10%; border: 2px solid rgba(255,255,255,.55); border-radius: 8px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
  .stage.hit .frame { border-color: var(--hit); }
  .hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 13px; color: rgba(255,255,255,.8); }

  .last {
    margin: 14px 12px 0; padding: 14px 16px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px;
    font: 600 26px/1.2 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .02em; word-break: break-all; min-height: 58px;
  }
  .last:empty::before { content: "კოდი ჯერ არ დასკანერებულა"; color: var(--dim); font: 400 15px/1.4 inherit; }

  ul { list-style: none; margin: 10px 12px 0; padding: 0; flex: 1; overflow-y: auto; }
  li { display: flex; gap: 12px; align-items: baseline; padding: 9px 4px; border-bottom: 1px solid var(--line); font: 400 15px/1.3 ui-monospace, Menlo, monospace; color: #c8cedb; }
  li .mark { color: var(--live); font-size: 13px; }
  li .mark.pending { color: var(--wait); }
  li time { color: var(--dim); font-size: 13px; margin-left: auto; }

  footer { display: flex; gap: 10px; padding: 12px; align-items: center; }
  button { flex: 1; padding: 16px; border: 0; border-radius: 12px; background: #b3261e; color: #fff; font: 600 17px/1 inherit; }
  button.stop { background: var(--panel); border: 1px solid var(--line); color: #eef1f6; }
  #zoom { margin: 12px 12px 0; width: calc(100% - 24px); accent-color: #b3261e; }
  button.icon { flex: 0 0 60px; background: var(--panel); border: 1px solid var(--line); font-size: 20px; }
  .dbg { margin: 6px 12px 0; font: 400 12px/1.5 ui-monospace, Menlo, monospace; color: var(--dim); white-space: pre-line; }
  .msg { margin: 10px 12px 0; font-size: 14px; color: #ff8f8f; }

  .setup { margin: 12px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .setup p { margin: 0 0 10px; font-size: 14px; color: var(--dim); }
  .setup input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: #0f1115; color: #eef1f6; font: 400 14px/1 ui-monospace, Menlo, monospace; }
  .setup button { margin-top: 10px; width: 100%; }
</style>
</head>
<body>

<header>
  <i class="dot" id="dot"></i>
  <span id="status">მზადაა</span>
  <b id="count">0</b>
</header>

<div class="stage" id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div class="frame"></div>
  <div class="hint">კოდი ჩაუშვი ჩარჩოში</div>
</div>

<div class="last" id="last"></div>
<div class="msg" id="msg"></div>
<div class="dbg" id="dbg"></div>
<ul id="log"></ul>

<div class="setup" id="setup" hidden>
  <p>ჩასვი Apps Script-ის მისამართი (/exec-ით მთავრდება)</p>
  <input id="api" placeholder="https://script.google.com/macros/s/.../exec" inputmode="url">
  <button id="saveApi">შენახვა</button>
</div>

<input type="range" id="zoom" hidden>

<footer>
  <button id="torch" class="icon" hidden>🔦</button>
  <button id="toggle">სკანირების დაწყება</button>
</footer>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
  window.zxingReady = window.ZXing ? Promise.resolve(true) : new Promise(res => {
    const s2 = document.createElement("script");
    s2.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    s2.onload = () => res(!!window.ZXing);
    s2.onerror = () => res(false);
    document.head.appendChild(s2);
  });
</script>
<script>
/* ─── აქ ჩასვი შენი Apps Script მისამართი ─────────────────────── */
let API = "https://script.google.com/macros/s/AKfycbxw9Apfwpr5duSnJSSOg3uC932EA0MOUQasQB015Que7dfFdvuZ4OEbN53LTMcw7Igu/exec";
/* ───────────────────────────────────────────────────────────────── */

const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
API = qs.get("api") || API;
const SESSION = qs.get("s") || "";

let scanning = false, stream = null, reader = null, count = 0;
let lastCode = "", lastAt = 0;
const queue = [];   // გაუგზავნელი კოდები (ინტერნეტის გათიშვისას)

if (!API) { $("setup").hidden = false; }
$("saveApi").onclick = () => {
  const v = $("api").value.trim();
  if (!/^https:\/\/script\.google\.com\/.*\/exec$/.test(v)) {
    $("msg").textContent = "მისამართი /exec-ით უნდა მთავრდებოდეს";
    return;
  }
  qs.set("api", v);
  location.search = qs.toString();   // ლინკში ჩაიწერება — შემდეგ ჯერზე აღარ იკითხავს
};

/* ─── ჩაწერა ცხრილში ─────────────────────────────────────────── */
async function flush() {
  if (!queue.length || !API) return;
  const batch = queue.splice(0, queue.length);
  setStatus("wait", "იგზავნება...");
  try {
    await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ session: SESSION, codes: batch })
    });
    batch.forEach(c => c.el?.querySelector(".mark")?.classList.remove("pending"));
    setStatus("on", "ცხრილში ჩაწერილია");
  } catch {
    queue.unshift(...batch);          // ვერ გაიგზავნა — რიგში ბრუნდება
    setStatus("wait", `რიგში ${queue.length} კოდი — ინტერნეტს ველოდები`);
  }
}
setInterval(flush, 4000);
window.addEventListener("online", flush);

function setStatus(cls, text) {
  $("dot").className = "dot " + cls;
  $("status").textContent = text;
}

function record(code) {
  const now = Date.now();
  if (code === lastCode && now - lastAt < 1500) return;
  lastCode = code; lastAt = now;

  const li = document.createElement("li");
  li.innerHTML = `<span class="mark pending">●</span><span class="code"></span><time></time>`;
  li.querySelector(".code").textContent = code;
  li.querySelector("time").textContent = new Date().toLocaleTimeString("ka-GE", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  $("log").prepend(li);

  queue.push({ code, at: new Date().toISOString(), qty: 1, el: li });
  $("last").textContent = code;
  $("count").textContent = ++count;

  navigator.vibrate?.(60);
  $("stage").classList.add("hit");
  setTimeout(() => $("stage").classList.remove("hit"), 250);

  flush();
}

/* ─── კამერა ─────────────────────────────────────────────────── */
async function start() {
  if (!API) { $("msg").textContent = "ჯერ Apps Script-ის მისამართი ჩასვი"; return; }
  $("msg").textContent = "";
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 }, height: { ideal: 1080 },
        focusMode: "continuous"
      }
    });
  } catch (e) {
    $("msg").textContent = "კამერა ვერ გაიხსნა: " + e.message;
    return;
  }
  scanning = true;
  setupCamControls(stream.getVideoTracks()[0]);
  $("toggle").textContent = "გაჩერება";
  $("toggle").classList.add("stop");

  const log = t => { $("dbg").textContent += t + "\n"; };
  $("dbg").textContent = "";

  let native = null;
  if ("BarcodeDetector" in window) {
    try {
      const sup = await BarcodeDetector.getSupportedFormats();
      log("BarcodeDetector: " + sup.join(", "));
      if (sup.includes("code_39") || sup.includes("code_128")) {
        native = new BarcodeDetector({
          formats: sup.filter(f => ["code_128","code_39","ean_13","ean_8","upc_a","upc_e","itf","qr_code"].includes(f))
        });
      } else {
        log("→ Code 39/128 არ უჭერს მხარს, ვიყენებ ZXing-ს");
      }
    } catch (e) { log("BarcodeDetector შეცდომა: " + e.message); }
  } else {
    log("BarcodeDetector: არ არსებობს");
  }

  if (native) {
    log("ძრავი: BarcodeDetector");
    $("video").srcObject = stream;
    await $("video").play();
    let frames = 0, failed = 0;
    const loop = async () => {
      if (!scanning) return;
      try {
        const hits = await native.detect($("video"));
        if (hits.length) record(hits[0].rawValue);
      } catch (e) {
        if (++failed === 1) log("detect შეცდომა: " + e.message);
        if (failed > 15) { log("→ გადავდივარ ZXing-ზე"); stop(); useZxing(); return; }
      }
      if (++frames % 30 === 0) $("dbg").dataset.f = frames;
      requestAnimationFrame(loop);
    };
    loop();
    return;
  }

  useZxing();

  async function useZxing() {
    const ok = await window.zxingReady;
    log("ZXing: " + (ok ? "ჩაიტვირთა" : "ვერ ჩაიტვირთა"));
    if (!ok) { $("msg").textContent = "სკანერის ბიბლიოთეკა ვერ ჩამოვიდა — ინტერნეტი შეამოწმე"; return; }

    const hints = new Map();
    const F = ZXing.BarcodeFormat;
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      F.CODE_128, F.CODE_39, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF, F.QR_CODE
    ]);
    reader = new ZXing.BrowserMultiFormatReader(hints, 120);
    scanning = true;
    let tries = 0;
    reader.decodeFromStream(stream, $("video"), (r, err) => {
      if (r) { record(r.getText()); return; }
      if (++tries % 40 === 0) log("ვცდილობ... კადრი " + tries);
      if (err && err.name && err.name !== "NotFoundException" && tries < 3) log("ZXing: " + err.name);
    }).then(() => log("ძრავი: ZXing გაშვებულია"))
      .catch(e => { $("msg").textContent = "ZXing ვერ გაეშვა: " + e.message; });
  }

function setupCamControls(track) {
  const caps = track.getCapabilities?.() || {};
  if (caps.zoom) {
    const z = $("zoom");
    z.min = caps.zoom.min; z.max = Math.min(caps.zoom.max, caps.zoom.min + 4);
    z.step = caps.zoom.step || 0.1; z.value = track.getSettings().zoom ?? caps.zoom.min;
    z.hidden = false;
    z.oninput = () => track.applyConstraints({ advanced: [{ zoom: Number(z.value) }] }).catch(() => {});
  }
  if (caps.torch) {
    const t = $("torch");
    t.hidden = false;
    let on = false;
    t.onclick = () => {
      on = !on;
      track.applyConstraints({ advanced: [{ torch: on }] }).catch(() => {});
      t.classList.toggle("stop", on);
    };
  }
}

function stop() {
  scanning = false;
  reader?.reset(); reader = null;
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  $("zoom").hidden = true; $("torch").hidden = true;
  $("toggle").textContent = "სკანირების დაწყება";
  $("toggle").classList.remove("stop");
}

$("toggle").onclick = () => (scanning ? stop() : start());
document.addEventListener("visibilitychange", () => { if (document.hidden && scanning) stop(); });
</script>
</body>
</html>
